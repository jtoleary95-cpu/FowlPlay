<!doctype html>
<html lang="en">

<title>Fowl Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0b12;--paper:#f6efd9;--sun:#ffd23f;--mint:#36d6c3;--rust:#ff9f3a;--bad:#ff5a5a;--sky:#0d0e1c;

*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--sky)}
body{margin:0;min-height:100%;background:var(--sky);color:var(--paper);font-family:var(--body);font-size:19px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:12px 14px 20px;overflow-x:hidden;overflow-x:clip}
#stars{position:fixed;inset:0;z-index:-1;width:100%;height:100%}

h2{font-family:var(--hand);font-weight:400;font-size:30px;margin:4px 0 10px}
.tag{text-align:center;opacity:.85;margin:0 0 16px}
.card{background:rgba(246,239,217,.07);border:2.5px solid var(--paper);border-radius:14px 18px 12px 20px;padding:14px;margin:12px 0}
.btn{display:block;width:100%;font:400 26px var(--hand);color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:12px 16px 10px 18px;
  box-shadow:4px 4px 0 var(--ink);padding:10px 12px;margin:10px 0;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.alt{background:var(--mint)}.btn.ghost{background:transparent;color:var(--paper);border-color:var(--paper);box-shadow:none}
.btn:disabled{opacity:.45}
input{width:100%;font:400 22px var(--body);padding:10px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);margin:6px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.muted{opacity:.7}.center{text-align:center}.err{color:var(--bad);min-height:24px}
.code{font:400 64px var(--hand);letter-spacing:10px;text-align:center;color:var(--sun)}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.world{display:flex;align-items:center;gap:10px;text-align:left;font:400 18px var(--body);color:var(--paper);background:rgba(246,239,217,.06);border:2.5px solid var(--paper);
  border-radius:12px 16px 10px 14px;padding:8px;cursor:pointer;touch-action:manipulation}
.world b{display:block;font:400 22px var(--hand);font-weight:400}
.world .orb{flex:0 0 40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);box-shadow:inset -6px -6px 0 rgba(0,0,0,.25)}
.world:disabled{opacity:.35}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.toggle button{font:400 20px var(--hand);min-width:84px;padding:6px 10px;border:2.5px solid var(--paper);border-radius:10px;background:transparent;color:var(--paper)}
.toggle button[aria-pressed=true]{background:var(--sun);color:var(--ink);border-color:var(--ink)}
/* game */
#game{position:relative;margin:0 auto}
#cv{display:block;width:100%;border:3px solid var(--paper);border-radius:12px;background:#000;touch-action:none}
.pads{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad{height:92px;font:400 30px var(--hand);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 #000;touch-action:none;user-select:none;-webkit-user-select:none}
.pad.main{background:var(--sun)}
.pad.on{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;filter:brightness(1.12)}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(5,5,12,.72);border-radius:12px}
.ov .card{background:#14152a;width:100%;max-width:400px}
.ov h2{color:var(--sun);margin-top:0}
.fact{background:rgba(54,214,195,.12);border-left:4px solid var(--mint);padding:8px 10px;border-radius:6px;margin:8px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.topbar button{font:400 18px var(--hand);color:var(--paper);background:transparent;border:2px solid rgba(246,239,217,.6);border-radius:10px;padding:3px 12px}
.score{font:400 22px var(--hand)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-right:6px;vertical-align:-1px}

html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
canvas,.pad{touch-action:none}
</style>

function setPath(obj, path, val){

/* ---------------- backend ---------------- */
const onlineApi = LOCAL ? (() => {
  const ch = ("BroadcastChannel" in window) ? new BroadcastChannel("fowlplay") : null;
  const subs = {};

/* deterministic randomness: same level for both racers */
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hsh = (k, s) => { const x = Math.sin(k * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= levels ================= */
function makeLevel(wi){
  const r = mulberry(9001 + wi * 7919), amp = 26 + wi * 6;
  const ph1 = r() * 6.28, ph2 = r() * 6.28, f1 = 1.4 + r() * 1.4, f2 = 3.2 + r() * 2.5;
  const raw = x => 535 - amp * Math.sin(x / W * 6.28 * f1 / 2 + ph1) * .7 - amp * .45 * Math.sin(x / W * 6.28 * f2 / 2 + ph2) + (r() - .5) * 0;

  for(let i = 0; i < N; i++){ const x = i * W / (N - 1); pts.push([x, clamp(raw(x), 430, 585)]); }
  const flat = (x0, x1, y) => { for(const p of pts) if(p[0] >= x0 - 1 && p[0] <= x1 + 1) p[1] = y; };
  const avg = (x0, x1) => { const s = pts.filter(p => p[0] >= x0 && p[0] <= x1); return s.reduce((a, p) => a + p[1], 0) / s.length; };
  const start = {x0: 18, x1: 78, kind: "start"};

function drawWorld(c, L, t, view){
  const w = WORLDS[L.wi];
  const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, w.sky[0]); sky.addColorStop(1, w.sky[1]); c.fillStyle = sky; c.fillRect(0, 0, W, H);
  if(L.wi !== 4) for(const [x, y, r, p] of L.stars){ c.globalAlpha = .45 + .45 * Math.sin(t * 1.5 + p * 9); c.fillStyle = "#fff"; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  // a sky object per world
  c.lineWidth = 2.5; c.strokeStyle = INK;
  if(L.wi === 0){ c.fillStyle = "#3d7be0"; c.beginPath(); c.arc(300, 80, 22, 0, 7); c.fill(); c.stroke(); c.fillStyle = "#4fa04a"; c.beginPath(); c.ellipse(293, 74, 9, 6, .5, 0, 7); c.fill(); }
  else if(L.wi === 6){ c.strokeStyle = "rgba(230,210,160,.45)"; c.lineWidth = 10; c.beginPath(); c.ellipse(180, 60, 260, 40, -.12, 0, Math.PI); c.stroke(); }
  else if(L.wi === 8){ c.fillStyle = "rgba(255,200,150,.07)"; for(let i = 0; i < 5; i++) c.fillRect(0, 40 + i * 70, W, 26); }
  else if(L.wi === 4){ c.fillStyle = "rgba(255,255,255,.75)"; for(const [x, y] of [[60, 70], [230, 110], [320, 50]]){ for(let i = -1; i <= 1; i++){ c.beginPath(); c.arc(x + i * 16, y, 14 - Math.abs(i) * 3, 0, 7); c.fill(); } } }
  else { c.fillStyle = L.wi === 1 ? "#ffe08a" : "#fff7c9"; c.beginPath(); c.arc(305, 70, L.wi === 1 ? 26 : L.wi >= 5 ? 4 : 12, 0, 7); c.fill(); }
  const hz = HZ[L.wi];
  if(hz?.draw && [3, 7, 8].includes(L.wi)) hz.draw(c, t, L);       // behind terrain
  // ground
  c.fillStyle = w.ground; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(0, H + 5);
  for(const [x, y] of L.pts) c.lineTo(x, y); c.lineTo(W, H + 5); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = w.dark; for(const k of L.craters){ const gy = L.gy(k.x) + k.d; c.beginPath(); c.ellipse(k.x, gy, k.s, k.s * .38, 0, 0, 7); c.fill(); c.strokeStyle = "rgba(0,0,0,.35)"; c.lineWidth = 2; c.stroke(); }
  // pads
  for(const p of L.pads){ const col = p.kind === "finish" ? "#3aa0ff" : p.kind === "rest" ? "#ffd23f" : "#cfcfcf";
    c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 2.5; c.fillRect(p.x0, p.y - 5, p.x1 - p.x0, 6); c.strokeRect(p.x0, p.y - 5, p.x1 - p.x0, 6);
    if(p.kind !== "start"){ c.fillStyle = "#fff"; c.font = "15px Gochi Hand, cursive"; c.textAlign = "center"; c.fillText(p.kind === "finish" ? "HOME" : "FUEL", (p.x0 + p.x1) / 2, p.y + 18); }
    for(const x of [p.x0 + 4, p.x1 - 4]){ c.fillStyle = (Math.sin(t * 5 + x) > 0) ? col : "#333"; c.beginPath(); c.arc(x, p.y - 8, 2.5, 0, 7); c.fill(); } }
  // rock ledges
  for(const r of L.rocks){ c.fillStyle = w.dark; c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(r.x, r.y); c.lineTo(r.x + r.w, r.y); c.lineTo(r.x + r.w - 6, r.y + r.h); c.lineTo(r.x + r.w * .55, r.y + r.h + 7); c.lineTo(r.x + 8, r.y + r.h); c.closePath(); c.fill(); c.stroke(); }
  if(hz?.draw && ![3, 7, 8].includes(L.wi)) hz.draw(c, t, L);
}

/* ================= audio ================= */
let AC = null, THR = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch{} } if(AC?.state === "suspended") AC.resume(); return AC; }
function snd(){ return getSet().snd && audio(); }
function noise(sec){ const ac = AC, b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
function thrustSound(level){
  const ac = snd(); if(!ac){ if(THR) THR.g.gain.value = 0; return; }
  if(!THR){ const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise(2); s.loop = true; f.type = "lowpass"; f.frequency.value = 520; g.gain.value = 0; s.connect(f).connect(g).connect(ac.destination); s.start(); THR = {g}; }
  THR.g.gain.setTargetAtTime(level, ac.currentTime, .03);
}
function tone(f0, f1, d, type = "sine", v = .16){ const ac = snd(); if(!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d); }
function boom(){ const ac = snd(); if(!ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise(1); f.type = "lowpass"; f.frequency.setValueAtTime(1500, t); f.frequency.exponentialRampToValueAtTime(90, t + .8); g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t + .9); s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + 1); tone(110, 35, .5, "sine", .5); }
const sBeam = () => { tone(500, 1400, .35, "triangle", .14); setTimeout(() => tone(1400, 1800, .12, "sine", .1), 300); };
const sLand = () => tone(160, 70, .18, "sine", .35);
const sWin = () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, .22, "square", .07), i * 120));

/* ================= the level runner ================= */
class Run {
  constructor(root, wi, o){ this.root = root; this.wi = wi; this.o = o; this.L = makeLevel(wi); this.inp = {u: false, l: false, r: false}; this.opp = null; this.fx = []; this.msg = null; this.mount(); this.reset(); this.alive = true; this.raf = requestAnimationFrame(t => this.frame(t)); }
  mount(){
    const w = WORLDS[this.wi];
    this.root.innerHTML = "";
    const g = el(`<div id="game"><div class="topbar"><button data-x>${this.o.mode === "race" ? "Leave" : "Levels"}</button><span class="score" data-sc></span></div>
      <div style="position:relative"><canvas id="cv"></canvas><div data-ov></div></div>
      <div class="pads"><button class="pad" data-k="l" aria-label="Left thruster">◀</button><button class="pad main" data-k="u" aria-label="Main thrust">THRUST</button><button class="pad" data-k="r" aria-label="Right thruster">▶</button></div></div>`);
    this.root.append(g); this.g = g; this.cv = g.querySelector("#cv"); this.c = this.cv.getContext("2d"); this.ov = g.querySelector("[data-ov]"); this.sc = g.querySelector("[data-sc]");
    g.querySelector("[data-x]").onclick = () => this.o.onExit();
    for(const b of g.querySelectorAll(".pad")){ const k = b.dataset.k;
      const on = e => { e.preventDefault(); audio(); try{ b.setPointerCapture(e.pointerId); }catch{} this.inp[k] = true; b.classList.add("on"); this.firstInput(); };
      const off = e => { this.inp[k] = false; b.classList.remove("on"); };
      b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointercancel", off); b.addEventListener("lostpointercapture", off); b.addEventListener("contextmenu", e => e.preventDefault()); }
    this.kd = e => { const k = {ArrowLeft: "l", ArrowRight: "r", ArrowUp: "u", " ": "u", a: "l", d: "r", w: "u"}[e.key]; if(k){ e.preventDefault(); this.inp[k] = e.type === "keydown"; this.firstInput(); } };
    addEventListener("keydown", this.kd); addEventListener("keyup", this.kd);
    this.fit = () => { const avail = innerHeight - 92 - 10 - 44 - 30, cw = Math.min(this.root.clientWidth, avail * W / H); this.cv.style.width = cw + "px"; this.g.style.width = Math.max(cw, 300) + "px";
      const d = Math.min(2, devicePixelRatio || 1); this.cv.width = Math.round(cw * d); this.cv.height = Math.round(cw * H / W * d); this.k = this.cv.width / W; };
    this.fit(); addEventListener("resize", this.fit);
    this.sc.textContent = `${w.name} · ${w.g} m/s²`;
  }
  stop(){ this.alive = false; cancelAnimationFrame(this.raf); removeEventListener("keydown", this.kd); removeEventListener("keyup", this.kd); removeEventListener("resize", this.fit); thrustSound(0); }
  unl(){ return this.o.unl; }
  reset(){
    const L = this.L; this.s = {x: L.start.x, y: L.start.y, vx: 0, vy: 0, fuel: FUEL_MAX, land: L.pads[0], dead: false, done: false, u: false, l: false, r: false};
    this.birds = L.birds.map((b, i) => ({...b, ...BIRDS[this.wi][i], got: false, beam: 0, gotAt: 0}));
    this.fx = []; this.ov.innerHTML = ""; this.lastStep = null;
    if(this.o.mode === "solo"){ this.t0 = null; this.msg = {txt: "Tap THRUST to launch", until: 1e12}; }
  }
  firstInput(){ if(this.o.mode === "solo" && this.t0 == null && !this.s.dead && this.inp.u){ this.t0 = performance.now(); this.msg = null; } }
  time(){ return this.o.mode === "race" ? (api.now() - this.o.at) / 1000 : this.t0 == null ? 0 : (performance.now() - this.t0) / 1000; }
  live(){ return this.o.mode === "race" ? this.time() >= 0 : this.t0 != null; }
  frame(now){
    if(!this.alive) return; this.raf = requestAnimationFrame(t => this.frame(t));
    if(this.lastStep == null) this.lastStep = now;
    let acc = Math.min(.1, (now - this.lastStep) / 1000); this.lastStep = now;
    const DT = 1 / 120; while(acc > 1e-6){ const d = Math.min(DT, acc); this.step(d); acc -= d; }
    const s = this.s; thrustSound(s.dead || s.done ? 0 : (s.u ? .16 : 0) + (s.l || s.r ? .06 : 0));
    this.draw(); this.o.tick?.(this);
  }
  step(dt){
    const s = this.s, L = this.L, inp = this.inp, t = this.time();
    for(const f of this.fx){ f.x += f.vx * dt; f.y += f.vy * dt; f.vy += L.g * .5 * dt; f.life -= dt; } this.fx = this.fx.filter(f => f.life > 0);
    if(s.dead || s.done || !this.live()) { s.u = s.l = s.r = false; return; }
    const fuelOk = this.unl() || s.fuel > 0;
    if(s.land){
      if(s.land.kind === "rest" && !this.unl()) s.fuel = Math.min(FUEL_MAX, s.fuel + 45 * dt);
      if(inp.u && fuelOk){ s.land = null; s.vy = -25; } else { s.u = s.l = s.r = false; return; }
    }
    s.u = inp.u && fuelOk; s.l = inp.l && fuelOk; s.r = inp.r && fuelOk;
    let ax = 0, ay = L.g;
    if(s.u) ay -= THRUST; if(s.l) ax -= SIDE; if(s.r) ax += SIDE;
    if(!this.unl()) s.fuel = Math.max(0, s.fuel - (s.u ? FUEL_MAIN : 0) * dt - ((s.l ? 1 : 0) + (s.r ? 1 : 0)) * FUEL_SIDE * dt);
    const hz = HZ[this.wi];
    if(hz?.force){ const f = hz.force(s, t, L); ax += f.ax; ay += f.ay; }
    if(hz?.drain && !this.unl()) s.fuel = Math.max(0, s.fuel - hz.drain(s, t) * dt);
    s.vx += ax * dt; s.vy += ay * dt; s.vx -= s.vx * DRAG * dt; s.vy -= s.vy * DRAG * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if(s.x < 17){ s.x = 17; s.vx = Math.max(0, s.vx); } if(s.x > W - 17){ s.x = W - 17; s.vx = Math.min(0, s.vx); }
    if(s.y < 12){ s.y = 12; s.vy = Math.max(0, s.vy); }
    // touching down
    const fl = s.x - 13, fr = s.x + 13, fy = s.y + 14;
    if(fy >= L.gy(fl) || fy >= L.gy(fr)){
      const pad = L.pads.find(p => fl >= p.x0 - 4 && fr <= p.x1 + 4 && Math.abs(fy - p.y) < 9);
      if(pad && s.vy < SAFE_VY && Math.abs(s.vx) < SAFE_VX) return this.landOn(pad);
      return this.crash(pad ? "land" : "ground");
    }
    for(const [px, py] of [[s.x - 16, s.y + 1], [s.x + 16, s.y + 1], [s.x, s.y + 9]]) if(py >= L.gy(px)) return this.crash("ground");
    for(const r of L.rocks){ const nx = clamp(s.x, r.x, r.x + r.w), ny = clamp(s.y + 3, r.y, r.y + r.h + 4); if(Math.hypot(nx - s.x, ny - s.y - 3) < 15) return this.crash("rock"); }
    if(hz?.hit && hz.hit(s, t, L)) return this.crash("hz" + this.wi);
    // tractor beam
    this.beaming = null;
    for(const b of this.birds){ if(b.got) continue; const dx = Math.abs(b.x - s.x), dy = b.y - s.y;
      if(dx < 18 && dy > 12 && dy < 120){ b.beam += dt; this.beaming = b; if(b.beam >= .6){ b.got = true; b.gotAt = performance.now(); sBeam(); this.msg = {txt: `Beamed up ${b.name}!`, until: performance.now() + 1400}; } }
      else b.beam = Math.max(0, b.beam - dt * 2); }
  }
  landOn(p){
    const s = this.s; s.y = p.y - 14; s.vx = s.vy = 0; s.land = p; s.u = s.l = s.r = false; sLand();
    const got = this.birds.filter(b => b.got).length;
    if(p.kind === "finish"){
      if(got === 3){ s.done = true; const ms = Math.round(this.time() * 1000); sWin(); this.o.onDone(ms, this); }
      else this.msg = {txt: `Grab all 3 birds first (${got}/3)`, until: performance.now() + 1800};
    } else if(p.kind === "rest") this.msg = {txt: this.unl() ? "Rest stop" : "Refueling…", until: performance.now() + 1200};
  }
  crash(why){
    const s = this.s; if(s.dead) return; s.dead = true; boom();
    for(let i = 0; i < 26; i++){ const a = Math.random() * 6.28, v = 40 + Math.random() * 140; this.fx.push({x: s.x, y: s.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: .6 + Math.random() * .6, c: ["#ffd23f", "#ff6a2a", "#fff", "#36d6c3"][i % 4]}); }
    setTimeout(() => this.alive && this.o.onCrash(why, this), 900);
  }
  draw(){
    const c = this.c, k = this.k, t = this.time(), L = this.L, s = this.s;
    c.setTransform(k, 0, 0, k, 0, 0); drawWorld(c, L, Math.max(0, t), this);
    const nowp = performance.now();
    for(const b of this.birds){
      if(b.got){ const a = (nowp - b.gotAt) / 450; if(a < 1) drawBird(c, b, b.x + (s.x - b.x) * a, b.y + (s.y - b.y) * a, 1 - a * .7, t); continue; }
      drawBird(c, b, b.x, b.y, 1, t);
    }
    if(this.beaming && !s.dead){ const b = this.beaming; c.fillStyle = `rgba(160,255,230,${.18 + .12 * Math.sin(nowp / 60)})`; c.beginPath(); c.moveTo(s.x - 7, s.y + 9); c.lineTo(s.x + 7, s.y + 9); c.lineTo(b.x + 18, b.y + 2); c.lineTo(b.x - 18, b.y + 2); c.closePath(); c.fill(); }
    if(this.opp && this.opp.l === this.wi && !this.opp.d){ const o = this.opp, age = Math.min(.4, Math.max(0, (api.now() - o.ts) / 1000)); drawShip(c, {x: o.x + o.vx * age, y: o.y + o.vy * age, u: o.u, l: o.ll, r: o.r}, "#ff9f3a", .5);
      c.globalAlpha = .8; c.fillStyle = "#ffd9a8"; c.font = "14px Patrick Hand, cursive"; c.textAlign = "center"; c.fillText(this.o.oppName || "Rival", o.x, o.y - 18); c.globalAlpha = 1; }
    if(!s.dead) drawShip(c, s, "#36d6c3", 1, t);
    for(const f of this.fx){ c.globalAlpha = Math.max(0, f.life); c.fillStyle = f.c; c.fillRect(f.x - 2.5, f.y - 2.5, 5, 5); } c.globalAlpha = 1;
    // HUD
    c.fillStyle = "rgba(0,0,0,.45)"; c.fillRect(0, 0, W, 34);
    c.fillStyle = "#f6efd9"; c.font = "16px Patrick Hand, cursive"; c.textAlign = "left"; c.fillText("FUEL", 8, 22);
    c.strokeStyle = "#f6efd9"; c.lineWidth = 2; c.strokeRect(46, 11, 70, 13);
    if(this.unl()){ c.fillStyle = "#36d6c3"; c.fillRect(47, 12, 68, 11); c.fillStyle = "#111"; c.textAlign = "center"; c.fillText("∞", 81, 22); }
    else { const f = s.fuel / FUEL_MAX; c.fillStyle = f > .3 ? "#36d6c3" : f > .12 ? "#ffd23f" : "#ff5a5a"; c.fillRect(47, 12, 68 * f, 11); }
    this.birds.forEach((b, i) => { c.globalAlpha = b.got ? 1 : .3; drawBird(c, b, 160 + i * 26, 30, .55, 0); c.globalAlpha = 1; });
    c.fillStyle = "#f6efd9"; c.textAlign = "right"; c.font = "18px Gochi Hand, cursive"; c.fillText(t >= 0 ? fmt(t * 1000) : "", W - 8, 23);
    if(this.opp && this.o.mode === "race"){ c.font = "13px Patrick Hand, cursive"; c.fillStyle = "#ffd9a8"; c.textAlign = "right"; c.fillText(`${this.o.oppName || "Rival"}: ${this.opp.l === this.wi ? this.opp.b || 0 : 0}/3`, W - 8, 48); }
    // speed warning while descending fast near ground
    if(!s.dead && !s.land && s.vy > SAFE_VY && s.y > L.gy(s.x) - 120){ c.fillStyle = "#ff5a5a"; c.font = "18px Gochi Hand, cursive"; c.textAlign = "center"; c.fillText("TOO FAST", s.x, s.y - 20); }
    // messages and countdown
    let m = this.msg && nowp < this.msg.until ? this.msg.txt : null;
    if(this.o.mode === "race" && t < 0){ const n = Math.ceil(-t); m = n <= 3 ? String(n) : this.o.banner || "Get ready"; if(n !== this.lastN && n <= 3){ this.lastN = n; sTick(); } }
    if(m){ c.font = m.length < 3 ? "72px Gochi Hand, cursive" : "26px Gochi Hand, cursive"; c.textAlign = "center"; c.lineWidth = 5; c.strokeStyle = "#111"; c.strokeText(m, W / 2, 150); c.fillStyle = "#ffd23f"; c.fillText(m, W / 2, 150); }
  }
  showOverlay(html){ this.ov.innerHTML = ""; const o = el(`<div class="ov">${html}</div>`); this.ov.append(o); return o; }
  factCard(why, extra = ""){
    const w = WORLDS[this.wi];
    return `<div class="card"><h2>Crashed on ${esc(w.name)}</h2><p>${esc(CRASH_WHY[why] || "Crashed")}.</p>
      <div class="fact"><b>${esc(w.name)}: ${w.g} m/s² (${gx(this.wi)})</b><br>${esc(w.fact)}</div>${extra}</div>`;
  }
}

/* ================= screens ================= */
function home(){
  const st = getSet();
  const w = screen(`<div><h1>FOWL PLAY</h1><p class="tag">Fly. Beam up the birds. Land soft.</p>
    <button class="btn" data-a="solo">Solo</button>
    <div class="card"><h2>Race a friend</h2><input id="nm" maxlength="14" placeholder="Your name" value="${esc(localStorage.getItem("fowl_name") || "")}">
      <button class="btn alt" data-a="make">Create race</button>
      <div class="row"><input id="cd" maxlength="4" placeholder="CODE" style="text-transform:uppercase"><button class="btn" data-a="join" style="margin:6px 0">Join</button></div><div class="err" data-e></div></div>
    <div class="card"><div class="toggle"><span>Unlimited fuel (solo)</span><button data-t="unl" aria-pressed="${st.unl}">${st.unl ? "On" : "Off"}</button></div>
      <div class="toggle"><span>Sound</span><button data-t="snd" aria-pressed="${st.snd}">${st.snd ? "On" : "Off"}</button></div></div></div>`);
  w.querySelector("[data-a=solo]").onclick = () => { audio(); levels(); };
  w.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { const s = getSet(); s[b.dataset.t] = !s[b.dataset.t]; putSet(s); home(); });
  const err = w.querySelector("[data-e]"), nm = () => { const n = w.querySelector("#nm").value.trim(); if(!n){ err.textContent = "Enter your name first."; return null; } if(!isCleanText(n)){ err.textContent = "Pick a different name."; return null; } localStorage.setItem("fowl_name", n); return n; };
  w.querySelector("[data-a=make]").onclick = async () => { const n = nm(); if(!n) return; audio(); err.textContent = "Creating…"; try{ await createRace(n); }catch(e){ err.textContent = "Couldn't connect. Check your signal."; } };
  w.querySelector("[data-a=join]").onclick = async () => { const n = nm(); if(!n) return; audio(); const code = w.querySelector("#cd").value.trim().toUpperCase(); if(code.length !== 4){ err.textContent = "Codes are 4 letters."; return; } err.textContent = "Joining…"; try{ await joinRace(code, n, err); }catch(e){ err.textContent = "Couldn't connect. Check your signal."; } };
  const q = new URLSearchParams(location.search).get("r"); if(q) w.querySelector("#cd").value = q.toUpperCase();
}
function levels(){
  const p = getProg();
  const w = screen(`<div><div class="topbar"><button data-x>← Back</button><span class="score">Solo</span></div><h2>Pick a world</h2><div class="worlds"></div>
    <p class="muted center" style="font-size:16px">Beat a world to open the next one.</p></div>`);
  w.querySelector("[data-x]").onclick = home;
  const grid = w.querySelector(".worlds");
  WORLDS.forEach((wd, i) => { const b = el(`<button class="world"><span class="orb" style="background:${wd.ground}"></span><span><b>${i + 1}. ${esc(wd.name)}</b>${wd.g} m/s²${p.best[i] ? ` · best ${fmt(p.best[i])}` : ""}</span></button>`);
    b.disabled = i >= p.open; b.onclick = () => solo(i); grid.append(b); });
}
function solo(wi){
  const w = screen(`<div></div>`);
  RUN = new Run(w, wi, {mode: "solo", unl: getSet().unl, onExit: levels,
    onCrash(why, run){ const o = run.showOverlay(run.factCard(why, `<button class="btn" data-a="re">Try again</button><button class="btn ghost" data-a="lv">Levels</button>`));
      o.querySelector("[data-a=re]").onclick = () => run.reset(); o.querySelector("[data-a=lv]").onclick = levels; },
    onDone(ms, run){ const p = getProg(); const prev = p.best[wi]; if(!prev || ms < prev) p.best[wi] = ms; p.open = Math.max(p.open, Math.min(10, wi + 2)); putProg(p);
      const names = run.birds.map(b => esc(b.name)).join(", ");
      const o = run.showOverlay(`<div class="card"><h2>${esc(WORLDS[wi].name)} cleared</h2><p>Saved ${names}.</p><p>Time: <b>${fmt(ms)}</b>${!prev || ms < prev ? " · new best" : ` · best ${fmt(prev)}`}</p>
        ${wi < 9 ? `<button class="btn" data-a="nx">Next: ${esc(WORLDS[wi + 1].name)}</button>` : `<p><b>All 30 birds saved.</b></p>`}<button class="btn ghost" data-a="re">Replay</button><button class="btn ghost" data-a="lv">Levels</button></div>`);
      o.querySelector("[data-a=nx]")?.addEventListener("click", () => solo(wi + 1)); o.querySelector("[data-a=re]").onclick = () => solo(wi); o.querySelector("[data-a=lv]").onclick = levels; }
  });
}

/* ================= race ================= */
const rid = code => "fp_" + code;
const nm = p => R?.players?.[p]?.name || (p === "p1" ? "Player 1" : "Player 2");
async function pTx(mut){ for(let i = 0; i < 8; i++){ try{ return await api.tx(rid(S.code), mut); }catch(e){ await sleep(300 + i * 400); } } return false; }
async function pUpd(patch){ for(let i = 0; i < 6; i++){ try{ return await api.update(rid(S.code), patch); }catch(e){ await sleep(300 + i * 500); } } }
async function createRace(name){
  const L = "ABCDEFGHJKMNPQRSTUVWXYZ"; let code;
  for(let i = 0; i < 12; i++){ code = [...Array(4)].map(() => L[Math.floor(Math.random() * L.length)]).join(""); if(!isClean(code)) continue; if(!(await api.get(rid(code)))) break; }
  await api.update(rid(code), {fp: 1, created: Date.now(), phase: "lobby", unl: getSet().unl, "players/p1": {name}});
  S = {code, pid: "p1", name}; STORE.setItem("fowl_s", JSON.stringify(S)); connect();
}
async function joinRace(code, name, err){
  const cur = await api.get(rid(code)); if(!cur || !cur.fp){ err.textContent = "No race with that code."; return; }
  if(cur.players?.p2 && cur.players.p2.name !== name){ err.textContent = "That race is full."; return; }
  const ok = await pTxCode(code, c => { if(c.players?.p2 && c.players.p2.name !== name) return false; c.players.p2 = {name}; });
  if(!ok){ err.textContent = "Couldn't join. Try again."; return; }
  S = {code, pid: "p2", name}; STORE.setItem("fowl_s", JSON.stringify(S)); connect();
}
async function pTxCode(code, mut){ for(let i = 0; i < 6; i++){ try{ return await api.tx(rid(code), mut); }catch(e){ await sleep(300 + i * 400); } } return false; }
function connect(){
  if(unsub) unsub(); mountedKey = ""; api.syncClock(rid(S.code), S.pid);
  unsub = api.listen(rid(S.code), v => { if(!S) return; if(!v){ leave(); return; } R = v; render(); });
}
function leave(){ if(unsub) unsub(); unsub = null; if(OPPD.off) OPPD.off(); OPPD.off = null; S = null; R = null; STORE.removeItem("fowl_s"); mountedKey = ""; home(); }
function render(){
  if(!R.players?.[S.pid]){ leave(); return; }
  if(R.phase === "lobby") return lobby();
  if(R.phase === "race") return raceLevel();
  if(R.phase === "over") return over();
}
function lobby(){
  const key = "lob" + JSON.stringify(R.players) + R.unl; if(mountedKey === key) return; mountedKey = key;
  const host = S.pid === "p1", ready = !!R.players?.p2;
  const w = screen(`<div><div class="topbar"><button data-x>Leave</button><span class="score">Race</span></div>
    <div class="card center"><h2>Race code</h2><div class="code">${S.code}</div>
      <p><span class="dot" style="background:#36d6c3"></span>${esc(nm("p1"))}${S.pid === "p1" ? " (you)" : ""}</p>
      <p><span class="dot" style="background:#ff9f3a"></span>${ready ? esc(nm("p2")) + (S.pid === "p2" ? " (you)" : "") : "Waiting for a friend…"}</p>
      <div class="toggle"><span>Unlimited fuel</span>${host ? `<button data-t aria-pressed="${!!R.unl}">${R.unl ? "On" : "Off"}</button>` : `<b>${R.unl ? "On" : "Off"}</b>`}</div>
      ${ready ? "" : `<button class="btn alt" data-a="inv">Send invite link</button>`}
      ${host ? `<button class="btn" data-a="go" ${ready ? "" : "disabled"}>Start race</button>` : `<p class="muted">Waiting for ${esc(nm("p1"))} to start.</p>`}
      <p class="muted" style="font-size:16px">All 10 worlds. Most worlds won takes it. Tie goes to lowest total time.</p></div></div>`);
  w.querySelector("[data-x]").onclick = leave;
  w.querySelector("[data-t]")?.addEventListener("click", () => pUpd({unl: !R.unl}));
  w.querySelector("[data-a=inv]")?.addEventListener("click", () => { const url = location.origin + location.pathname + "?r=" + S.code; if(navigator.share) navigator.share({title: "Fowl Play", text: "Race me in Fowl Play: " + S.code, url}).catch(() => {}); else navigator.clipboard?.writeText(url); });
  w.querySelector("[data-a=go]")?.addEventListener("click", () => pTx(c => { if(c.phase !== "lobby" || !c.players?.p2) return false; Object.assign(c, {phase: "race", l: 0, at: api.now() + 5000, wins: {p1: 0, p2: 0}, tt: {p1: 0, p2: 0}, lv: {}, rm: {}}); }));
}
const OPPD = {off: null, key: "", last: 0};
function raceLevel(){
  const L = R.l, key = "lv" + R.created + ":" + L + ":" + R.at;
  if(mountedKey === key){ updScore(); return; } mountedKey = key;
  const prev = R.lv?.[L - 1];
  const banner = prev ? `${prev.w === S.pid ? "You" : nm(prev.w)} won ${WORLDS[L - 1].name} · ${fmt(prev.t)}` : "Race starts";
  const w = screen(`<div></div>`), me = S.pid, o = opp(me);
  RUN = new Run(w, L, {mode: "race", at: R.at, unl: !!R.unl, banner, oppName: nm(o), onExit(){ if(confirm("Leave the race?")) leave(); },
    onCrash(why, run){ let n = 3; const ov = run.showOverlay(run.factCard(why, `<button class="btn" data-a="go">Back in (${n})</button>`)), b = ov.querySelector("[data-a=go]");
      const go = () => { clearInterval(iv); if(run.alive) run.reset(); }; b.onclick = go; const iv = setInterval(() => { n--; if(n <= 0) go(); else b.textContent = `Back in (${n})`; }, 1000); },
    onDone(ms, run){ run.showOverlay(`<div class="card center"><h2>Landed!</h2><p>${fmt(ms)}</p></div>`);
      pTx(c => { if(c.phase !== "race" || c.l !== L || c.lv?.[L]) return false; c.lv ||= {}; c.lv[L] = {w: me, t: ms};
        c.wins[me] = (c.wins[me] || 0) + 1; c.tt[me] = (c.tt[me] || 0) + ms; c.tt[o] = (c.tt[o] || 0) + ms + 15000;
        if(L >= 9) c.phase = "over"; else { c.l = L + 1; c.at = api.now() + 6000; } });
      landWatch(L, ms); },
    tick(run){ const now = performance.now(); if(now - OPPD.last < 250) return; OPPD.last = now; const s = run.s;
      api.update(rid(S.code) + "_s_" + me, {l: L, x: Math.round(s.x * 10) / 10, y: Math.round(s.y * 10) / 10, vx: Math.round(s.vx), vy: Math.round(s.vy), u: s.u ? 1 : 0, ll: s.l ? 1 : 0, r: s.r ? 1 : 0, d: s.dead ? 1 : 0, b: run.birds.filter(b => b.got).length, ts: api.now()}).catch(() => {}); }
  });
  if(OPPD.key !== S.code + o){ if(OPPD.off) OPPD.off(); OPPD.key = S.code + o; OPPD.off = api.listen(rid(S.code) + "_s_" + o, v => { OPPD.v = v; if(RUN) RUN.opp = v; }); }
  RUN.opp = OPPD.v || null;
  updScore();
}
function updScore(){ if(!RUN) return; const me = S.pid, o = opp(me); RUN.sc.textContent = `${WORLDS[R.l].name} · You ${R.wins?.[me] || 0}–${R.wins?.[o] || 0} ${nm(o)}`; }
function over(){
  const key = "over" + R.created + JSON.stringify(R.rm || {}); if(mountedKey === key) return; mountedKey = key;
  const me = S.pid, o = opp(me), wm = R.wins?.[me] || 0, wo = R.wins?.[o] || 0, tm = R.tt?.[me] || 0, to = R.tt?.[o] || 0;
  const won = wm > wo || (wm === wo && tm < to), tieTime = wm === wo, draw = wm === wo && tm === to;
  const rows = WORLDS.map((wd, i) => { const r = R.lv?.[i]; return r ? `<p style="margin:2px 0">${i + 1}. ${esc(wd.name)}: <b>${r.w === me ? "You" : esc(nm(r.w))}</b> · ${fmt(r.t)}</p>` : ""; }).join("");
  const w = screen(`<div><div class="topbar"><button data-x>Leave</button><span class="score">Final</span></div>
    <h1 style="font-size:54px">${draw ? "Dead even!" : won ? "You win!" : esc(nm(o)) + " wins"}</h1>
    <p class="center score">You ${wm} – ${wo} ${esc(nm(o))}</p>${tieTime ? `<p class="center">Tied on worlds. Total time: you ${fmt(tm)}, ${esc(nm(o))} ${fmt(to)}.</p>` : ""}
    <div class="card">${rows}<p class="muted" style="font-size:15px">A world's loser gets the winner's time plus 15s toward total time.</p></div>
    <button class="btn" data-a="re" ${R.rm?.[me] ? "disabled" : ""}>${R.rm?.[me] ? `Waiting for ${esc(nm(o))}…` : "Rematch"}</button></div>`);
  w.querySelector("[data-x]").onclick = leave;
  w.querySelector("[data-a=re]").onclick = () => pTx(c => { if(c.phase !== "over") return false; c.rm ||= {}; c.rm[me] = true;
    if(c.rm[o]) Object.assign(c, {phase: "race", l: 0, at: api.now() + 5000, wins: {p1: 0, p2: 0}, tt: {p1: 0, p2: 0}, lv: {}, rm: {}, created: Date.now()}); });
}

/* debug hooks for testing */
window.FP = {get run(){ return RUN; }, get R(){ return R; }, makeLevel, WORLDS, BIRDS};

/* boot */
(() => { try{ const s = JSON.parse(STORE.getItem("fowl_s") || "null"); if(s?.code){ S = s; connect(); return; } }catch{} home(); })();

/* after landing: re-send the win until the race moves on; if this phone missed the update, reconnect */
function landWatch(L, ms){
  const t0 = Date.now(), me = S.pid, o = opp(me), code = S.code;
  const iv = setInterval(() => {
    if(!S || S.code !== code || !R){ clearInterval(iv); return; }
    if(R.phase === "over" || R.l > L){ clearInterval(iv); return; }
    if(!R.lv?.[L]) pTx(c => { if(c.phase !== "race" || c.l !== L || c.lv?.[L]) return false; c.lv ||= {}; c.lv[L] = {w: me, t: ms};
      c.wins[me] = (c.wins[me] || 0) + 1; c.tt[me] = (c.tt[me] || 0) + ms; c.tt[o] = (c.tt[o] || 0) + ms + 15000;
      if(L >= 9) c.phase = "over"; else { c.l = L + 1; c.at = api.now() + 6000; } });
    if(Date.now() - t0 > 6000 && Date.now() - (landWatch.rc || 0) > 6000){ landWatch.rc = Date.now(); if(unsub) unsub(); unsub = api.listen(rid(S.code), v => { if(!S) return; if(!v){ leave(); return; } R = v; render(); }); }
  }, 2000);
}
/* iPhone: no long-press text selection, Look Up or callout menus during play */
document.addEventListener("contextmenu", e => { if(!(e.target.closest && e.target.closest("input"))) e.preventDefault(); });
document.addEventListener("selectstart", e => { if(!(e.target.closest && e.target.closest("input"))) e.preventDefault(); });
document.addEventListener("touchstart", e => { if(e.target.closest && e.target.closest(".pad, canvas")) e.preventDefault(); }, {passive: false});

</script>
